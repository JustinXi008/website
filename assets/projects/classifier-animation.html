<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Post Text Classifier — Text in. Insight out.</title>
<style>
  html,body{margin:0;min-height:100%;background:#f3f2ec}
  /* Scoped styles keep the animation easy to embed. */
  .classifier{--paper:#f3f2ec;--ink:#222b28;--line:#d7dcd1;--green:#254d3b;box-sizing:border-box;width:100%;color:var(--ink);background:var(--paper);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;padding:32px clamp(18px,5vw,76px);overflow:hidden}
  .classifier *{box-sizing:border-box}
  .classifier .wrap{max-width:1200px;margin:auto}
  .classifier .eyebrow{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-bottom:22px;font:11px/1.5 'SFMono-Regular',Consolas,monospace;letter-spacing:.1em;text-transform:uppercase}
  .classifier .brand{display:flex;align-items:center;gap:10px;font-weight:bold}
  .classifier .brand-mark{width:19px;height:19px;display:grid;grid-template-columns:1fr 1fr;gap:3px;transform:rotate(-8deg)}
  .classifier .brand-mark i{background:var(--green);border-radius:2px}
  .classifier .brand-mark i:last-child{background:#df7755}
  .classifier .edition{font-size:10px;color:#75816d;letter-spacing:.04em}
  .classifier .stage{position:relative;border:1px solid var(--line);border-radius:15px;background:#eeefe7;isolation:isolate;overflow:hidden}
  .classifier .stage:before{content:"";position:absolute;inset:0;z-index:-1;background-image:radial-gradient(#9ca893 .7px,transparent .7px);background-size:18px 18px;opacity:.24;pointer-events:none}
  .classifier .stage-top{display:flex;align-items:center;padding:17px 22px 0;font:10px/1.5 'SFMono-Regular',Consolas,monospace;letter-spacing:.1em;color:#66715f;text-transform:uppercase}
  .classifier .live{display:inline-flex;align-items:center;gap:7px}
  .classifier .live:before{content:"";height:6px;width:6px;background:#477450;border-radius:50%;box-shadow:0 0 0 3px #47745015}
  .classifier .scene{width:100%;height:auto;display:block;overflow:visible}
  .classifier .scene text{font-family:Arial,Helvetica,sans-serif;fill:var(--ink)}
  .classifier .scene .mono{font-family:'SFMono-Regular',Consolas,monospace}
  .classifier .scene .muted{fill:#73806e}
  .classifier .scene .line{stroke:#b5c1af;stroke-width:1.5;fill:none}
  .classifier .controls{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;border-top:1px solid var(--line);background:#f7f7f1}
  .classifier .sample-wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;min-width:0;padding:4px;background:#e9ecE2;border-radius:10px}
  .classifier .actions{display:flex;gap:7px;flex-shrink:0}
  .classifier button{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 13px;min-height:36px;border:1px solid #cbd2c3;border-radius:6px;background:transparent;color:var(--ink);font:12px/1.4 Arial,sans-serif;cursor:pointer}
  .classifier button:hover{background:#e6eadc}
  .classifier button:focus-visible{outline:2px solid #426c3c;outline-offset:3px}
  .classifier .sample-choice{min-width:0;min-height:33px;padding:7px 13px;border:0;border-radius:7px;white-space:nowrap;color:#727d68;transition:background .18s ease,color .18s ease,box-shadow .18s ease}
  .classifier .sample-choice:hover{background:#dde4d3;color:#354a35}
  .classifier .sample-choice[aria-pressed="true"]{background:#fffef8;color:#254d3b;box-shadow:0 1px 4px #263c2414;font-weight:600}
  .classifier button svg{width:13px;height:13px;stroke:currentColor;stroke-width:1.5;fill:none}
  .classifier .primary{background:var(--ink);color:#f1f5e7;border-color:var(--ink);min-width:88px}
  .classifier .primary:hover{background:var(--green)}
  .classifier .process{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin:22px 0 0;padding:0;list-style:none}
  .classifier .process-step{position:relative;display:flex;align-items:baseline;gap:9px;padding-top:12px;border-top:2px solid #d7dcd1;font-size:13px;line-height:1.5;color:#75816d}
  .classifier .process-step:before{content:"";position:absolute;left:0;top:-2px;width:var(--progress,0%);height:2px;background:var(--green)}
  .classifier .process-step[aria-current="step"]{color:var(--ink)}
  .classifier .process-no{font:10px/1.5 'SFMono-Regular',Consolas,monospace;color:#829077}
  .classifier .process-step[aria-current="step"] .process-no{color:var(--green)}
  .classifier .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
  @media(max-width:760px){.classifier{padding:22px 18px}.classifier .eyebrow{font-size:10px}.classifier .edition{font-size:9px}.classifier .stage-top{padding:15px 16px 0}.classifier .controls{padding:14px}}
  @media(max-width:520px){.classifier .controls{flex-wrap:wrap;gap:10px}.classifier .sample-wrap,.classifier .actions{width:100%}.classifier .sample-choice{padding:9px 4px;min-height:40px;font-size:11px}.classifier .actions button{flex:1;min-height:42px}.classifier .process{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px}.classifier .process-step{font-size:12px;gap:7px}}
  @media(pointer:coarse){.classifier .sample-choice{min-height:44px}}
  @media(prefers-reduced-motion:reduce){.classifier .sample-choice{transition:none}}
  /* Add ?embed=1 to show only the animation panel. */
  .classifier.embed{padding:clamp(14px,2.3vw,26px);background:var(--paper)}.classifier.embed .eyebrow{display:none}.classifier.embed .wrap{max-width:none}
  html.preview-page,html.preview-page body{height:100%;min-height:0}
  .classifier.preview{padding:0;height:100%;display:grid;align-items:center}
  .classifier.preview .wrap{width:100%}
  .classifier.preview .eyebrow,.classifier.preview .stage-top,.classifier.preview .controls,.classifier.preview .process{display:none}
  .classifier.preview .stage{border:0;border-radius:0;background:transparent}
  .classifier.preview .scene{width:100%;height:auto}
</style>
</head>
<body>
<main class="classifier" id="text-classifier">
<div class="wrap">
  <header class="eyebrow"><div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Classifier</div><span class="edition">C++ · Naive Bayes</span></header>
  <section class="stage" aria-label="Animated text classification demo">
    <div class="stage-top"><span class="live" id="live-label">Live</span></div>
    <svg class="scene" id="classifier-scene" viewBox="0 0 1120 340" role="img" aria-labelledby="scene-title scene-desc">
      <title id="scene-title">A text classifier in motion</title><desc id="scene-desc">A document is split into unique words. A Naive Bayes model adds word log-likelihoods to the class log-prior, then chooses the highest scoring category. The demo uses an illustrative training corpus.</desc>
      <defs>
        <filter id="c-shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#233a22" flood-opacity=".06"/></filter>
        <pattern id="c-core-grid" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0H0V12" fill="none" stroke="#68916a" stroke-opacity=".17" stroke-width=".6"/></pattern>
      </defs>
      <g id="routes"></g><g id="source"></g><g id="engine"></g><g id="result"></g><g id="particles" aria-hidden="true"></g><g id="annotations"></g>
    </svg>
    <div class="controls">
      <div class="sample-wrap" role="group" aria-label="Choose a sample">
        <button type="button" class="sample-choice" id="sample-0" aria-pressed="true">Garden</button>
        <button type="button" class="sample-choice" id="sample-1" aria-pressed="false">Code</button>
        <button type="button" class="sample-choice" id="sample-2" aria-pressed="false">Design</button>
        <button type="button" class="sample-choice" id="sample-3" aria-pressed="false" aria-label="Sample with an unknown word">Unknown</button>
      </div>
      <div class="actions"><button type="button" id="replay"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6a5.4 5.4 0 1 1-.2 4M3 2v4h4"/></svg>Replay</button><button type="button" class="primary" id="toggle" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true" id="play-icon"><path d="M5 3v10M11 3v10"/></svg><span id="play-label">Pause</span></button></div>
    </div>
  </section>
  <ol class="process" aria-label="Classification process">
    <li class="process-step" id="process-0" aria-current="step"><span class="process-no">01</span><span>Read the text</span></li>
    <li class="process-step" id="process-1"><span class="process-no">02</span><span>Keep unique words</span></li>
    <li class="process-step" id="process-2"><span class="process-no">03</span><span>Weigh the evidence</span></li>
    <li class="process-step" id="process-3"><span class="process-no">04</span><span>Choose a category</span></li>
  </ol>
  <p class="sr-only" id="classifier-status" aria-live="polite"></p>
</div>
</main>
<script>
(() => {
  'use strict';
  const root = document.getElementById('text-classifier');
  if (new URLSearchParams(location.search).get('embed') === '1') root.classList.add('embed');
  const preview = new URLSearchParams(location.search).get('preview') === '1';
  if (preview) { root.classList.add('preview'); document.documentElement.classList.add('preview-page'); }
  const $ = id => root.querySelector('#' + id);
  const scene = $('classifier-scene');
  const processSteps = [0,1,2,3].map(i=>$('process-'+i));
  const NS = 'http://www.w3.org/2000/svg';
  const colors = {nature:'#60884d',technology:'#6b8f99',design:'#d1805a'};
  // An original, small demonstration corpus. No original project data is embedded.
  // The whitespace tokenization, document counts, fallback rules and lexical tie
  // break mirror the C++ implementation. This is not a call to the C++ executable.
  const training = {
    nature:['leaf flower garden green','tree leaf forest green','flower garden plant bloom','forest tree leaf plant','garden soil flower bloom','leaf green garden plant'],
    technology:['code data server system','code program memory system','server data network system','code memory program logic','network server data code','program system memory data'],
    design:['color layout shape form','design color type layout','shape form design space','layout color grid type','design shape color grid','form space layout design']
  };
  const samples = [
    {title:'a note from the garden',text:'leaf leaf flower garden'},
    {title:'inside the machine',text:'code data code server'},
    {title:'at the design studio',text:'color layout color shape'},
    {title:'an unfamiliar word',text:'garden flower stardust'}
  ];
  const labels = Object.keys(training).sort();
  const unique = text => [...new Set(text.trim().split(/\s+/).filter(Boolean))].sort();
  const counts = {},global = new Map(); let total=0;
  for(const label of labels){counts[label]=new Map();for(const doc of training[label]){total++;for(const word of unique(doc)){counts[label].set(word,(counts[label].get(word)||0)+1);global.set(word,(global.get(word)||0)+1);}}}
  const prior = label => Math.log(training[label].length/total);
  const likelihood = (word,label) => Math.log(counts[label].has(word)?counts[label].get(word)/training[label].length:global.has(word)?global.get(word)/total:1/total);
  const score = (words,label) => prior(label)+words.reduce((s,w)=>s+likelihood(w,label),0);
  let current=0,time=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,last=0,visible=true,layout=null,announced=false;
  const duration=13000;
  let wordNodes=[],rows=[],inputTokens=[],coreBars=[],sourceHint,sourceBadge,engineRing,routeIn,routeOut;
  const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
  const ease=x=>{x=clamp(x);return x*x*(3-2*x);};
  function el(tag,attrs={},parent,text){const n=document.createElementNS(NS,tag);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,v);if(text!==undefined)n.textContent=text;if(parent)parent.appendChild(n);return n;}
  function rect(parent,x,y,w,h,fill,r=0,extra={}){return el('rect',{x,y,width:w,height:h,rx:r,fill,...extra},parent);}
  function text(parent,x,y,content,size=14,extra={}){return el('text',{x,y,'font-size':size,...extra},parent,content);}
  function line(parent,x1,y1,x2,y2,stroke='#dce1d4',extra={}){return el('line',{x1,y1,x2,y2,stroke,...extra},parent);}
  function build(){
    const width=scene.clientWidth;
    const mobile=!preview&&width<720;
    const W=mobile?400:1120,H=mobile?760:340;
    scene.setAttribute('viewBox',`0 0 ${W} ${H}`);
    const S=mobile?{x:50,y:35,w:300,h:168}:{x:36,y:98,w:264,h:168};
    const E=mobile?{x:200,y:365}:{x:560,y:182};
    const R=mobile?{x:50,y:520,w:300,h:214}:{x:820,y:65,w:264,h:234};
    layout={mobile,W,H,S,E,R};
    ['routes','source','engine','result','particles','annotations'].forEach(id=>$(id).replaceChildren());
    const routes=$('routes'),source=$('source'),engine=$('engine'),result=$('result');
    const ip=mobile?`M${E.x} ${S.y+S.h}V${E.y-86}`:`M${S.x+S.w} ${E.y}H${E.x-86}`;
    const op=mobile?`M${E.x} ${E.y+86}V${R.y}`:`M${E.x+86} ${E.y}H${R.x}`;
    el('path',{d:ip,class:'line'},routes);el('path',{d:op,class:'line'},routes);
    routeIn=el('path',{d:ip,stroke:'transparent',fill:'none'},routes);routeOut=el('path',{d:op,stroke:'transparent',fill:'none'},routes);
    if(mobile){[(S.y+S.h+E.y-86)/2,(E.y+86+R.y)/2].forEach(y=>{line(routes,E.x-7,y-3,E.x,y+4,'#aab79f');line(routes,E.x+7,y-3,E.x,y+4,'#aab79f');});}
    else{[(S.x+S.w+E.x-86)/2,(E.x+86+R.x)/2].forEach(x=>{line(routes,x-7,E.y-7,x,E.y,'#aab79f');line(routes,x-7,E.y+7,x,E.y,'#aab79f');});}
    text(source,S.x,S.y-17,'TEXT',11,{class:'mono muted','letter-spacing':1.2});
    rect(source,S.x,S.y,S.w,S.h,'#fffef8',12,{stroke:'#d6dccf',filter:'url(#c-shadow)'});
    rect(source,S.x,S.y,S.w,35,'#f6f7f0',12);rect(source,S.x,S.y+20,S.w,15,'#f6f7f0');
    [0,1,2].forEach((i)=>el('circle',{cx:S.x+16+i*10,cy:S.y+17,r:2.5,fill:['#b9c5ae','#d5dbce','#d5dbce'][i]},source));
    text(source,S.x+S.w-16,S.y+21,'message.txt',10,{'text-anchor':'end',class:'mono muted'});
    inputTokens=[];
    const raw=samples[current].text.split(' ');let tx=S.x+20,ty=S.y+68;
    const seen=new Set();
    raw.forEach((w,i)=>{const tw=w.length*8+20;if(tx+tw>S.x+S.w-15){tx=S.x+20;ty+=35;}
      const g=el('g',{},source);rect(g,tx,ty-17,tw,27,'#f0f3e8',5);text(g,tx+10,ty+1,w,14,{class:'mono'});
      const repeated=seen.has(w);seen.add(w);const strike=line(g,tx+7,ty-5,tx+tw-7,ty-5,'#b1775e',{'stroke-width':1.5,opacity:0});inputTokens.push({g,strike,repeated});tx+=tw+7;
    });
    line(source,S.x+20,S.y+S.h-43,S.x+S.w-20,S.y+S.h-43);
    sourceBadge=rect(source,S.x+20,S.y+S.h-33,5,5,'#9fa993',2.5);
    sourceHint=text(source,S.x+32,S.y+S.h-27,'4 words',10,{class:'mono muted'});
    // The processing unit represents a count-based model, rather than a neural network.
    const ex=E.x-74,ey=E.y-74;
    [0,1,2,3,4].forEach(i=>{const o=30+i*22;rect(engine,ex-10,ey+o,12,5,'#91a184',2);rect(engine,ex+146,ey+o,12,5,'#91a184',2);rect(engine,ex+o,ey-10,5,12,'#91a184',2);rect(engine,ex+o,ey+146,5,12,'#91a184',2);});
    rect(engine,ex,ey,148,148,'#254d3b',22,{stroke:'#204333','stroke-width':1.5,filter:'url(#c-shadow)'});
    rect(engine,ex+8,ey+8,132,132,'url(#c-core-grid)',16);
    engineRing=rect(engine,ex+14,ey+14,120,120,'none',13,{stroke:'#c9ee85','stroke-opacity':.16,'stroke-width':1});
    text(engine,E.x,E.y-32,'NAIVE BAYES',10,{'text-anchor':'middle',class:'mono','letter-spacing':1.5,style:'fill:#b5cba5'});
    coreBars=[];for(let i=0;i<5;i++){coreBars.push(rect(engine,E.x-38+i*16,E.y-4,9,26,'#d4f47c',3));}
    text(result,R.x,R.y-17,'PREDICTION',11,{class:'mono muted','letter-spacing':1.2});
    rect(result,R.x,R.y,R.w,R.h,'#fffef8',12,{stroke:'#d6dccf',filter:'url(#c-shadow)'});
    text(result,R.x+20,R.y+29,'LOG SCORE',10,{class:'mono muted','letter-spacing':1});
    rows=[];
    const words=unique(samples[current].text), finals=labels.map(l=>score(words,l)),low=Math.floor(Math.min(...finals)-2);
    labels.forEach((l,i)=>{const y=R.y+65+i*(mobile?52:59),g=el('g',{},result);const highlight=rect(g,R.x+10,y-25,R.w-20,49,'#e5efce',8,{opacity:0});const dot=el('circle',{cx:R.x+24,cy:y-4,r:3,fill:colors[l]},g);text(g,R.x+35,y,l[0].toUpperCase()+l.slice(1),13);const value=text(g,R.x+R.w-20,y,'—',12,{'text-anchor':'end',class:'mono'});rect(g,R.x+20,y+11,R.w-40,5,'#edf0e6',2.5);const bar=rect(g,R.x+20,y+11,0,5,colors[l],2.5);const check=el('path',{d:`M${R.x+R.w-90} ${y-5}l4 4 8-9`,fill:'none',stroke:'#477450','stroke-width':1.8,opacity:0},g);rows.push({label:l,g,value,bar,dot,low,highlight,check});});
    wordNodes=[];
    words.forEach((w,i)=>{const g=el('g',{opacity:0},$('particles')),tw=w.length*7.2+22;rect(g,-tw/2,-14,tw,28,'#d4f47c',6,{stroke:'#b4d363','stroke-width':.8});text(g,0,4,w,12,{'text-anchor':'middle',class:'mono'});wordNodes.push({g,w,i});});
    for(let i=0;i<3;i++){const c=el('circle',{r:3.5,fill:'#60884d',opacity:0,'data-out':i},$('particles'));}
    render();
  }
  function stateAt(t){return t<1600?0:t<3800?1:t<8500?2:3;}
  function render(){
    if(!layout)return;
    const {mobile,S,E,R}=layout;
    const words=unique(samples[current].text),stage=stateAt(time);
    inputTokens.forEach(({g,strike,repeated})=>{const progress=ease((time-1800)/750);g.setAttribute('opacity',repeated?1-progress*.62:1);strike.setAttribute('opacity',repeated?progress:0);});
    sourceHint.textContent=time<1700?`${samples[current].text.split(' ').length} words`:`${samples[current].text.split(' ').length} → ${words.length} words`;
    sourceBadge.setAttribute('fill',time<1700?'#a2ae96':'#60884d');
    const arrived=words.map((_,i)=>clamp((time-(3400+i*1300))/1050));
    wordNodes.forEach(({g,i})=>{const u=(time-(2650+i*1300))/1050;const p=clamp(u);const pt=routeIn.getPointAtLength(routeIn.getTotalLength()*ease(p));g.setAttribute('transform',`translate(${pt.x},${pt.y})`);g.setAttribute('opacity',u<0||u>1?0:Math.min(1,u*8,(1-u)*8));});
    coreBars.forEach((b,i)=>{const motion=stage===2?Math.sin(time/230+i*1.15)*12:0;const h=[17,33,25,43,30][i]+motion; b.setAttribute('height',h);b.setAttribute('y',E.y+16-h);b.setAttribute('opacity',stage<2?.4:1);});
    engineRing.setAttribute('stroke-opacity',stage===2?.35+Math.sin(time/300)*.18:.16);
    const values=labels.map(l=>prior(l)+words.reduce((s,w,i)=>s+likelihood(w,l)*ease(arrived[i]),0));
    const finalValues=labels.map(l=>score(words,l));
    const best=labels.reduce((a,b)=>score(words,b)>score(words,a)?b:a,labels[0]);
    const predicted=stage===3;
    rows.forEach(({label,g,value,bar,dot,low,highlight,check},i)=>{const won=predicted&&label===best;value.textContent=time<2850?'—':values[i].toFixed(2);bar.setAttribute('width',time<2850?0:(R.w-40)*clamp((values[i]-low)/-low));g.setAttribute('opacity',predicted&&!won?.45:1);dot.setAttribute('r',won?4:3);highlight.setAttribute('opacity',won?1:0);check.setAttribute('opacity',won?1:0);});
    $('particles').querySelectorAll('[data-out]').forEach((n,i)=>{const u=(time-(8300+i*150))/750;const pt=routeOut.getPointAtLength(routeOut.getTotalLength()*ease(clamp(u)));n.setAttribute('cx',pt.x);n.setAttribute('cy',pt.y);n.setAttribute('opacity',u>=0&&u<=1?Math.min(u*10,(1-u)*10,1):0);});
    processSteps.forEach((step,i)=>{
      const starts=[0,1600,3800,8500],ends=[1600,3800,8500,11000];
      step.setAttribute('aria-current',i===stage?'step':'false');
      step.style.setProperty('--progress',clamp((time-starts[i])/(ends[i]-starts[i]))*100+'%');
    });
    if(predicted&&!announced){$('classifier-status').textContent=`Predicted category: ${best}. Log score ${Math.max(...finalValues).toFixed(2)}.`;announced=true;}
  }
  function syncButton(){
    $('toggle').setAttribute('aria-pressed',String(paused));
    $('toggle').setAttribute('aria-label',paused?'Play animation':'Pause animation');
    $('play-label').textContent=paused?'Play':'Pause';
    $('play-icon').replaceChildren();el('path',{d:paused?'M5 3l8 5-8 5Z':'M5 3v10M11 3v10'},$('play-icon'));
    $('live-label').textContent=paused?'Paused':'Live';
  }
  function restart(){time=0;last=0;announced=false;$('classifier-status').textContent='';render();}
  $('toggle').addEventListener('click',()=>{paused=!paused;last=0;syncButton();});
  $('replay').addEventListener('click',()=>{restart();paused=false;syncButton();});
  const sampleButtons=samples.map((_,i)=>$('sample-'+i));
  sampleButtons.forEach((button,i)=>button.addEventListener('click',()=>{
    current=i;
    sampleButtons.forEach((choice,j)=>choice.setAttribute('aria-pressed',String(j===current)));
    announced=false;time=paused?10000:0;last=0;build();
  }));
  if (preview) window.addEventListener('message',event=>{
    if(event.source!==window.parent||event.data?.type!=='classifier:pause')return;
    paused=Boolean(event.data.paused);last=0;syncButton();
  });
  const reduce=matchMedia('(prefers-reduced-motion: reduce)');
  reduce.addEventListener('change',e=>{if(e.matches){paused=true;time=10000;render();syncButton();}});
  // Pause off-screen and in background tabs without consuming animation time.
  new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;last=0;},{threshold:0}).observe(root);
  document.addEventListener('visibilitychange',()=>{last=0;});
  new ResizeObserver(()=>{const w=scene.clientWidth;if(!layout||Math.abs((layout.clientWidth||0)-w)>1){build();layout.clientWidth=w;}}).observe(scene);
  if(paused)time=10000;
  build();layout.clientWidth=scene.clientWidth;syncButton();
  function tick(now){if(!paused&&visible&&!document.hidden){if(last)time+=Math.min(now-last,80);if(time>=duration){time%=duration;announced=false;}render();}last=now;requestAnimationFrame(tick);}
  requestAnimationFrame(tick);
  // Let an embedding page fit the panel without an inner scrollbar.
  if (window.parent !== window && root.classList.contains('embed')) {
    let lastHeight=0;
    const reportHeight=()=>{
      const height=Math.ceil(root.getBoundingClientRect().height)+4;
      if(height!==lastHeight){lastHeight=height;window.parent.postMessage({type:'classifier:resize',height},'*');}
    };
    new ResizeObserver(reportHeight).observe(root);
    requestAnimationFrame(reportHeight);
  }
})();
</script>
</body>
</html>
